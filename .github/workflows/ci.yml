name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality (Windows)
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm

      - name: Use the declared npm version
        shell: pwsh
        run: |
          $pkgManager = node -p "require('./package.json').packageManager"
          if ($pkgManager -notmatch '^npm@(\d+\.\d+\.\d+)$') {
            throw "Invalid packageManager field: $pkgManager"
          }
          $npmVersion = $Matches[1]
          npm install --global --ignore-scripts "npm@$npmVersion"
          if ((npm --version) -ne $npmVersion) {
            throw "Expected npm $npmVersion, got $(npm --version)"
          }

      - name: Check project installation scripts before installing dependencies
        run: node scripts/check-npm-install.mjs

      - name: Install locked Node dependencies
        run: npm ci

      - name: Audit the complete Node dependency graph
        run: npm run audit:dependencies

      - name: Check TypeScript 7 release and TypeScript 6 API compatibility
        run: npm run typecheck:all

      - name: Lint JavaScript and formatting
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Run frontend tests
        run: npm run test:run

      - name: Build the production frontend
        run: npm run build

      - name: Build the embedded TypeScript engine and verify third-party notice parity
        shell: pwsh
        run: |
          npm run build:engine
          $guiHash = (Get-FileHash dist/third-party-notices.txt -Algorithm SHA256).Hash
          $cliHash = (Get-FileHash dist-engine/third-party-notices.txt -Algorithm SHA256).Hash
          if ($guiHash -ne $cliHash) {
            throw "Third-party notice parity mismatch: GUI=$guiHash CLI=$cliHash"
          }

  rust:
    name: Rust quality (Windows)
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm

      - name: Use the declared npm version
        shell: pwsh
        run: |
          $pkgManager = node -p "require('./package.json').packageManager"
          if ($pkgManager -notmatch '^npm@(\d+\.\d+\.\d+)$') {
            throw "Invalid packageManager field: $pkgManager"
          }
          $npmVersion = $Matches[1]
          npm install --global --ignore-scripts "npm@$npmVersion"
          if ((npm --version) -ne $npmVersion) {
            throw "Expected npm $npmVersion, got $(npm --version)"
          }

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Keep the Cargo target on the Cargo registry drive
        shell: pwsh
        run: |
          $cargoHome = if ([string]::IsNullOrWhiteSpace($env:CARGO_HOME)) {
            Join-Path $env:USERPROFILE ".cargo"
          } else {
            $env:CARGO_HOME
          }
          $targetDir = Join-Path $cargoHome "ssahdrify-target"
          "CARGO_TARGET_DIR=$targetDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check project installation scripts before installing dependencies
        run: node scripts/check-npm-install.mjs

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build the embedded TypeScript engine
        run: npm run build:engine

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Reproduce the locked Windows native license notices
        run: node scripts/native-notices.mjs --check

      - name: Run Clippy on every Rust target
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run the locked Rust test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Smoke-test the standalone CLI binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --bin ssahdrify-cli

      - name: Smoke-test the Tauri build entry point
        run: npm run tauri build -- --debug --no-bundle --ci
