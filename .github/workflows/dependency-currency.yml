name: Dependency currency

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript-aliases:
    name: TypeScript alias currency
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          check-latest: true

      - name: Check aliased TypeScript package versions
        run: node scripts/check-typescript-currency.mjs
