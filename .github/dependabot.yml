version: 2

# Routine version-update PRs stay disabled so dependency maintenance can be
# reviewed on one human branch. Security updates use separate repository
# settings and limits.
# The groups and holds below remain ready if routine updates are re-enabled.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-npm-patches:
        patterns:
          - "*"
        update-types:
          - patch
    ignore:
      # Dependabot currently skips npm aliases in version-update jobs. The
      # dependency-currency workflow checks all TypeScript alias layers weekly.
      # Keep this hold as the intended boundary if alias updating is supported.
      # This alias supplies the TS6 API until programmatic consumers support TS7.
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"

      # These typings intentionally enforce the Node 22.13 API floor.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-cargo-patches:
        patterns:
          - "*"
        update-types:
          - patch
    ignore:
      # Every deno_core release requires a V8/API/runtime audit.
      - dependency-name: deno_core
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"

      # rusqlite 0.40's SQLite bindings require Rust 1.95; keep the 1.91 floor.
      - dependency-name: rusqlite
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

      # Tauri's dialog plugin still constrains the shared graph to rfd 0.16.
      - dependency-name: rfd
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
